<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Days Counter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Critical CSS with Light Font Style -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0c0f14;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-border: rgba(255, 255, 255, 0.08);
      --text: #f4f6fb;
      --text-muted: rgba(244, 246, 251, 0.65);
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.18);
      --glow: rgba(124, 156, 255, 0.35);
      
      --font-sans: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "Instrument Serif", Georgia, serif;
    }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }
    .bg-glow { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; }
    .bg-glow--one { width: 480px; height: 480px; top: -120px; right: -80px; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); }
    .bg-glow--two { width: 400px; height: 400px; bottom: -100px; left: -60px; background: radial-gradient(circle, rgba(180, 130, 255, 0.22) 0%, transparent 70%); }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1rem 3rem;
      max-width: 520px;
      margin: 0 auto;
    }
    .counter-number {
      font-family: var(--font-serif);
      font-weight: 300;           /* Light weight */
      font-size: clamp(5rem, 22vw, 8rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .title {
      font-weight: 300;           /* Light weight */
    }
  </style>

  <!-- Full Stylesheet -->
  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="styles.css"></noscript>

  <!-- Google Fonts - Light weights included -->
  <link 
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital,wght@0,300;0,400;1,400&display=swap" 
    rel="stylesheet" 
    media="print" 
    onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
  </noscript>
</head>
<body>
  <div class="bg-glow bg-glow--one"></div>
  <div class="bg-glow bg-glow--two"></div>

  <main class="container">
    <header class="header">
      <p class="eyebrow">Days Counter</p>
      <h1 class="title">Track every moment</h1>
    </header>

    <div id="countersList" class="counters-list"></div>

    <button type="button" class="add-btn" id="addCounterBtn">
      Add another counter
    </button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
